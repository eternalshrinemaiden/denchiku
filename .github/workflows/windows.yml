name: Windows build

# Разовая сборка: запускается вручную на вкладке Actions -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    name: denchiku.exe (x86_64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Установка MSYS2 UCRT64 и зависимостей
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            zip

      - name: Конфигурация
        run: meson setup build-win --buildtype=release

      - name: Сборка
        run: meson compile -C build-win

      - name: Упаковка
        run: bash build-aux/package-windows.sh build-win

      - name: Архив
        run: |
          cd dist
          zip -r -9 ../denchiku-windows-x86_64.zip denchiku

      - name: Выгрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: denchiku-windows-x86_64
          path: denchiku-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
