# Манифест Flatpak для keruu.
# Сборка: flatpak-builder --user --install --force-clean build-flatpak org.svyata.keruu.yml
app-id: org.svyata.keruu
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: keruu

finish-args:
  # Вывод звука.
  - --socket=pulseaudio
  # Окна: Wayland с запасным X11.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Аппаратное ускорение для интерфейса GTK.
  - --device=dri
  # Медиатека читается из папки «Музыка»; запись не нужна.
  - --filesystem=xdg-music:ro

modules:
  - name: keruu
    buildsystem: meson
    sources:
      - type: dir
        path: .
        skip:
          - build
          - .git
