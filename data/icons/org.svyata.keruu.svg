<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#8474ff"/>
      <stop offset="0.55" stop-color="#6a5be0"/>
      <stop offset="1" stop-color="#8b3fd0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e3ff"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.2" flood-color="#2a1250" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clip">
      <rect x="8" y="8" width="112" height="112" rx="28"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="66" fill="url(#glow)" clip-path="url(#clip)"/>

  <g fill="url(#note)" filter="url(#soft)">
    <polygon points="58,30 108,22 108,36 58,44"/>
    <rect x="58" y="30" width="8" height="60"/>
    <rect x="100" y="22" width="8" height="60"/>
    <ellipse cx="47" cy="90" rx="15" ry="11" transform="rotate(-20 47 90)"/>
    <ellipse cx="89" cy="82" rx="15" ry="11" transform="rotate(-20 89 82)"/>
  </g>
</svg>
